name: Install Nix
description: >-
  Install the Nix release that src/agentix/image.py pins for building the
  Modal image. Run it after actions/checkout, which provides that file.

# No Nix store cache. Magic Nix Cache added 7 minutes to the first green run,
# 8.5 in all: its post step spent 408 s uploading 477 store paths one at a
# time, and 395 of them were public paths that cache.nixos.org already serves.
# Restoring them was no faster than fetching them from cache.nixos.org. The
# check builds only about 80 small derivations itself, and on the cold run its
# build step, downloads included, took 43 s. Revisit this if the check starts
# to build something expensive.

runs:
  using: composite
  steps:
    - name: Read the image's Nix release
      id: pin
      shell: bash
      working-directory: ${{ github.workspace }}
      # NIX_BUILDER names the official image of a release, such as
      # "nixos/nix:2.35.6-amd64@sha256:...". The pattern admits only digits
      # and dots.
      run: |
        version=$(sed -n 's|^ *"nixos/nix:\([0-9][0-9.]*\)-amd64"$|\1|p' \
          src/agentix/image.py | head -n 1)
        if [ -z "$version" ]; then
          echo "::error file=src/agentix/image.py::No nixos/nix release found in NIX_BUILDER. Update .github/actions/nix/action.yml."
          exit 1
        fi
        echo "Installing Nix $version, as the Modal image build does."
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      with:
        install_url: https://releases.nixos.org/nix/nix-${{ steps.pin.outputs.version }}/install
