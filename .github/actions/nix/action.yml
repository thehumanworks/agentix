name: Install Nix
description: >-
  Install the Determinate Nix release that src/agentix/image.py pins for the
  Modal image. Run it after actions/checkout, which provides that file.

# No Nix store cache. Magic Nix Cache added 7 minutes to the first green run,
# 8.5 in all: its post step spent 408 s uploading 477 store paths one at a
# time, and 395 of them were public paths that cache.nixos.org already serves.
# Restoring them was no faster than fetching them from cache.nixos.org. The
# check builds only about 80 small derivations itself, and on the cold run its
# build step, downloads included, took 43 s. Revisit this if the check starts
# to build something expensive.

runs:
  using: composite
  steps:
    - name: Read the image's Nix release
      id: pin
      shell: bash
      working-directory: ${{ github.workspace }}
      # Either NIX_INSTALLER_VERSION = "v3.24.2" or a NIX_INSTALLER URL that
      # ends in /nix/tag/v3.24.2. The pattern admits only v, digits, and dots.
      run: |
        tag=$(sed -n \
          -e 's|^NIX_INSTALLER_VERSION = "\(v[0-9][0-9.]*\)"$|\1|p' \
          -e 's|^NIX_INSTALLER = "https://install\.determinate\.systems/nix/tag/\(v[0-9][0-9.]*\)"$|\1|p' \
          src/agentix/image.py | head -n 1)
        if [ -n "$tag" ]; then
          echo "Installing Determinate Nix $tag, as the Modal image does."
        else
          echo "::warning file=src/agentix/image.py::No Determinate Nix release found in src/agentix/image.py, so CI installs the newest one. Update .github/actions/nix/action.yml."
        fi
        echo "tag=$tag" >> "$GITHUB_OUTPUT"

    - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      with:
        source-tag: ${{ steps.pin.outputs.tag }}
        diagnostic-endpoint: ""
