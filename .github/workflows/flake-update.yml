name: Flake update

on:
  schedule:
    # Mondays at 05:23 UTC.
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Fetches and builds the new inputs before anyone has reviewed them, so it
  # gets a read-only token and no cache: nothing it builds reaches the cache
  # that CI on the default branch restores.
  update:
    name: Update and check the lock
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.update.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix
        with:
          cache: "false"
      - name: Update every input
        id: update
        working-directory: nix
        run: |
          mkdir -p "$RUNNER_TEMP/flake-update"
          nix flake update 2>&1 | tee "$RUNNER_TEMP/flake-update/update.log"
          if git diff --quiet -- flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No input moved, so there is nothing to propose." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Evaluate every system
        if: steps.update.outputs.changed == 'true'
        working-directory: nix
        run: nix flake check --all-systems --no-build
      - name: Build and lint x86_64-linux
        if: steps.update.outputs.changed == 'true'
        working-directory: nix
        run: nix flake check --keep-going --print-build-logs
      - name: Write the pull request
        if: steps.update.outputs.changed == 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          out="$RUNNER_TEMP/flake-update"
          cp nix/flake.lock "$out/flake.lock"
          # shellcheck disable=SC2016 # The backticks are Markdown.
          {
            echo 'Weekly `nix flake update` in `nix/`. The inputs that moved:'
            echo
            echo '```text'
            # From the first "• Updated input" on, without the fetch messages.
            sed -n '/^• /,$p' "$out/update.log"
            echo '```'
            echo
            echo "These checks passed on the new lock in [the workflow run]($RUN_URL):"
            echo
            echo '- `nix flake check --all-systems --no-build`, which evaluates the x86_64, ARM, and Mac outputs.'
            echo '- `nix flake check` on x86_64-linux: formatting, statix, deadnix, the `modal` profile, and the OCI image check.'
            echo
            echo 'The ARM and Mac profiles are evaluated, not built. The workflow opened this pull request with its own token, so CI does not start on it; close and reopen the pull request to run CI.'
            echo
            echo '**Merging requires an image rebuild.** The lock is an input of the Modal image, and this workflow neither builds nor publishes it. After merging, follow `AGENTS.md`: run `uv run agentix image build`, verify the published image in a fresh sandbox, and remove that sandbox.'
          } > "$out/body.md"
          cat "$out/body.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.update.outputs.changed == 'true'
        with:
          name: flake-update
          path: |
            ${{ runner.temp }}/flake-update/flake.lock
            ${{ runner.temp }}/flake-update/body.md
          if-no-files-found: error
          retention-days: 7
      - name: Report a lock that fails the checks
        if: failure() && steps.update.outputs.changed == 'true'
        run: |
          # shellcheck disable=SC2016 # The backticks are Markdown.
          {
            echo '## The updated lock fails the checks'
            echo
            echo 'No pull request was opened. The inputs that moved:'
            echo
            echo '```text'
            cat "$RUNNER_TEMP/flake-update/update.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Holds the write token and runs no Nix: it only commits the checked lock.
  pull-request:
    name: Open the pull request
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flake-update
          path: ${{ runner.temp }}/flake-update
      - name: Take the checked lock
        run: cp "$RUNNER_TEMP/flake-update/flake.lock" nix/flake.lock
      # Reuses the branch and its open pull request when one is left from an
      # earlier week. GitHub refuses the pull request unless the repository
      # allows GitHub Actions to create pull requests.
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: automation/flake-update
          base: ${{ github.ref_name }}
          add-paths: nix/flake.lock
          commit-message: Update the pinned Nix inputs
          title: Update the pinned Nix inputs
          body-path: ${{ runner.temp }}/flake-update/body.md
          delete-branch: true
