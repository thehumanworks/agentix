name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  python:
    name: Python tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # tests/support.py makes any call that reaches Modal fail.
      - name: Tests
        run: uv run --locked --with pytest pytest -q
      - name: Ruff lint
        run: uv run --locked ruff check
      - name: Ruff format
        run: uv run --locked ruff format --check

  # One job, not an eval job and a build job. From an empty store, both checks
  # took 37 s in a Modal sandbox and 64 s on a runner: 620 MiB downloaded from
  # cache.nixos.org, 82 small local builds, 2.9 GiB added to the store. A
  # split would install Nix and fetch the inputs twice. It keeps no store cache;
  # .github/actions/nix/action.yml says why.
  nix:
    name: Nix flake check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: nix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Not $/.github/actions/nix, which zizmor suggests: actionlint 1.7.12
      # rejects it. The checkout above is the only earlier step, so ./ loads
      # this commit's action.
      - uses: ./.github/actions/nix # zizmor: ignore[self-repository]
      # The x86_64, ARM, and Mac profiles and both OCI images, without building.
      - name: Evaluate every system
        run: nix flake check --all-systems --no-build
      # Formatting, statix, deadnix, the modal profile, and the OCI image check.
      - name: Build and lint x86_64-linux
        run: nix flake check --keep-going --print-build-logs

  # The same build on a native ARM runner: modal-arm and the ARM OCI image's
  # root and layer list. It runs beside the x86_64 job and does
  # about the same work, so CI takes no longer. Under qemu-user emulation the
  # profile builds but the OCI image does not: its fakechroot step runs proot,
  # which needs ptrace, and qemu-user has none.
  nix-arm:
    name: Nix flake check (ARM)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: nix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix # zizmor: ignore[self-repository]
      # Formatting, statix, deadnix, the modal-arm profile, the OCI image
      # check, and the SSH engine checks, for aarch64-linux.
      - name: Build and lint aarch64-linux
        run: nix flake check --keep-going --print-build-logs
