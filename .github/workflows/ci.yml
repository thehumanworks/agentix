name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  python:
    name: Python tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # tests/support.py makes any call that reaches Modal fail.
      - name: Tests
        run: uv run --locked --with pytest pytest -q
      - name: Ruff lint
        run: uv run --locked ruff check
      - name: Ruff format
        run: uv run --locked ruff format --check

  # One job, not an eval job and a build job. From an empty store, both checks
  # took 37 s in a Modal sandbox: 620 MiB downloaded, 82 small local builds,
  # 2.9 GiB added to the store. That fits a standard runner, and a split would
  # install Nix and fetch the inputs twice.
  nix:
    name: Nix flake check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: nix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix
      # The x86_64, ARM, and Mac profiles and both OCI images, without building.
      - name: Evaluate every system
        run: nix flake check --all-systems --no-build
      # Formatting, statix, deadnix, the modal profile, and the OCI image check.
      - name: Build and lint x86_64-linux
        run: nix flake check --keep-going --print-build-logs
