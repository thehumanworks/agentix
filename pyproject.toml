[project]
name = "agentix"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fire>=0.7.1",
    "modal>=1.6.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
agentix = "agentix.__main__:main"

[tool.ruff]
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]
